name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest

    env:
      NEON_CSS: |
        :root { color-scheme: dark; }
        body {
          background-color: #0a0e14 !important;
          font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Consolas, monospace !important;
        }
        h1, h2, h3, h4 {
          color: #39ff9c !important;
          letter-spacing: 0.5px;
        }
        a {
          color: #00e5ff !important;
        }
        small, .text-small, .color-fg-muted {
          color: #7d8a9c !important;
        }
        svg {
          background-color: #0a0e14 !important;
        }

    steps:

      # ===============================================================
      # CHECKOUT
      # ===============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ===============================================================
      # 1) ACCOUNT OVERVIEW
      # ===============================================================

      - name: Generate account overview stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Navin-J48&show_icons=true&hide_border=true&theme=dark&bg_color=0a0e14&title_color=39ff9c&icon_color=00e5ff&text_color=c9d1d9&hide=contribs
          path: dashboard-account.svg
          token: ${{ secrets.GITHUB_TOKEN }}


      # ===============================================================
      # 2) TOP LANGUAGES
      # ===============================================================

      - name: Generate top languages stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Navin-J48&layout=compact&hide_border=true&theme=dark&bg_color=0a0e14&title_color=39ff9c&text_color=c9d1d9
          path: dashboard-top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}


      # ===============================================================
      # 3) PROFILE HEADER + ACTIVITY
      # ===============================================================

      - name: Generate header + activity panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: Navin-J48
          filename: dashboard-header.svg
          base: "header, activity, community"
          base_indepth: yes
          config_timezone: ${{ vars.METRICS_TIMEZONE || 'Asia/Kolkata' }}
          extras_css: ${{ env.NEON_CSS }}


      # ===============================================================
      # 4) ISOMETRIC CONTRIBUTION CALENDAR
      # ===============================================================

      - name: Generate isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: Navin-J48
          filename: dashboard-calendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: ${{ vars.METRICS_TIMEZONE || 'Asia/Kolkata' }}
          extras_css: ${{ env.NEON_CSS }}


      # ===============================================================
      # 5) CODING HABITS
      # ===============================================================

      - name: Generate coding habits panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: Navin-J48
          filename: dashboard-habits.svg
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_days: 30
          config_timezone: ${{ vars.METRICS_TIMEZONE || 'Asia/Kolkata' }}
          extras_css: ${{ env.NEON_CSS }}


      # ===============================================================
      # 6) LANGUAGES IN DEPTH
      # ===============================================================

      - name: Generate languages panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: Navin-J48
          filename: dashboard-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%
          extras_css: ${{ env.NEON_CSS }}


      # ===============================================================
      # 7) PROJECT SPOTLIGHT
      # ===============================================================

      - name: Generate project spotlight panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: Navin-J48
          filename: dashboard-repositories.svg
          base: ""
          plugin_repositories: yes
          plugin_repositories_pinned: 3
          extras_css: ${{ env.NEON_CSS }}


      # ===============================================================
      # 8) COMMIT GENERATED STATS CARDS
      # ===============================================================

            - name: Commit generated stats cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dashboard-account.svg
          git add dashboard-top-languages.svg

          git commit -m "Update GitHub stats cards" || exit 0

          git pull --rebase origin main

          git push origin main
        
